name: Professional UX Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/professional_upgrade.py'
      - '.github/workflows/professional_upgrade.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply professional role and map upgrades
        run: python .github/scripts/professional_upgrade.py
      - name: Commit generated upgrade
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "JeevanSetu CI"
          git config user.email "actions@users.noreply.github.com"
          git add lib/judge_experience.dart
          git commit -m "Upgrade role experiences with live maps and richer operational UI"
          git push
